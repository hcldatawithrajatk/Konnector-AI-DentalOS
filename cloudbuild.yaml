steps:
  # 1. Build the container image using Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/konnector-ai-dentalos:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/konnector-ai-dentalos:latest'
      - '.'

  # 2. Push container image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/konnector-ai-dentalos:$COMMIT_SHA'

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'konnector-ai-dentalos'
      - '--image'
      - 'gcr.io/$PROJECT_ID/konnector-ai-dentalos:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '20'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'

images:
  - 'gcr.io/$PROJECT_ID/konnector-ai-dentalos:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/konnector-ai-dentalos:latest'

timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
